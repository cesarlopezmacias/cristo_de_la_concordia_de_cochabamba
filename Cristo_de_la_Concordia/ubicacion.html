<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ubicación | Cristo de la Concordia</title>

    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }
        html{
            scroll-behavior:smooth;
        }

        body{
            font-family:Arial, sans-serif;
            color:white;
            background:
            linear-gradient( rgba(3,8,15,.82), rgba(3,8,15,.92) ),
            url("2da-imagen.png");
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
            min-height:100vh;
            overflow-x:hidden;
        }
        #menu{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:78px;
            background:rgba(5,10,18,.88);
            backdrop-filter:blur(15px);
            display:flex;
           justify-content:flex-start;  
            align-items:center;
            gap:38px;
            padding:0 55px;
            z-index:1000;
            border-bottom:1px solid rgba(255,255,255,.08);
        }

        #menu a{
            color:white;
            text-decoration:none;
            font-size:18px;
            font-weight:bold;
            transition:.3s;
        }

        #menu a:hover{
            color:#d8b45a;
            text-shadow: 0 0 10px rgba(216,180,90,.8);
            transform:translateY(-2px);
        }
        .encabezado{
            text-align:center;
            padding-top:130px;
            padding-bottom:35px;
            animation:aparecer 1s ease;
        }

        .subtitulo{
            display:block;
            color:#d8b45a;
            font-size:14px;
            letter-spacing:7px;
            margin-bottom:15px;
        }

        .encabezado h1{
            font-family: "Times New Roman",
            serif;
            font-size:62px;
            line-height:1.05;
            letter-spacing:3px;
            text-shadow:
            0 0 15px rgba(255,255,255,.25);
        }

        .encabezado h1 span{
            display:block;
            color:#d8b45a;
            margin-top:5px;
        }

        .encabezado p{
            margin:22px auto 0;
            max-width:800px;
            font-size:18px;
            color:#ddd;
            line-height:1.7;
        }

        .ubicacion{
            width:90%;
            max-width:1250px;
            margin:auto;
            padding-bottom:80px;
        }

        .mapa-contenedor{
            position:relative;
            width:100%;
            height:500px;
            border-radius:28px;
            overflow:hidden;
            border:1px solid
            rgba(216,180,90,.55);

            box-shadow:
            0 0 35px rgba(0,0,0,.7);

            animation:subir 1s ease;
        }

        .mapa-contenedor iframe{

            width:100%;
            height:100%;
            border:0;
            filter:
            grayscale(25%)
            brightness(.78)
            contrast(1.05);
        }

        .marcador{
            position:absolute;
            top:25px;
            left:25px;
            z-index:5;
            background:
            rgba(5,10,18,.88);
            backdrop-filter:blur(12px);
            padding:18px 24px;
            border-radius:15px;
            border:1px solid
            rgba(216,180,90,.6);
            box-shadow:
            0 0 20px rgba(0,0,0,.5);
        }

        .marcador h3{
            color:#d8b45a;
            margin-bottom:6px;
            font-family:
            "Times New Roman",
            serif;
            font-size:23px;
        }


        .marcador p{

            color:#ddd;
            font-size:14px;
        }
        .informacion{
            display:grid;
            grid-template-columns:
            repeat(3,1fr);
            gap:22px;
            margin-top:35px;
        }


        .tarjeta{

            background:
            rgba(10,16,25,.82);
            border:1px solid
            rgba(216,180,90,.35);
            border-radius:20px;
            padding:30px;
            min-height:210px;
            backdrop-filter:blur(12px);
            transition:.4s;
            animation:subir 1s ease;
        }

        .tarjeta:hover{
            transform:
            translateY(-8px);
            border-color:#d8b45a;
            box-shadow:
            0 10px 30px
            rgba(0,0,0,.5);
        }

        .icono{
            font-size:35px;
            margin-bottom:15px;
        }

        .tarjeta h2{

            font-family:
            "Times New Roman",
            serif;
            color:#d8b45a;
            font-size:28px;
            margin-bottom:15px;
        }
        .tarjeta p{
            color:#ddd;
            line-height:1.7;
            font-size:15px;
        }
        .coordenadas{
            margin-top:25px;
            padding:25px;
            text-align:center;
            background:
            rgba(10,16,25,.8);
            border-radius:20px;
            border:
            1px solid
            rgba(216,180,90,.35);
        }

        .coordenadas h2{

            font-family:
            "Times New Roman",
            serif;
            color:#d8b45a;
            margin-bottom:10px;
        }
        .coordenadas p{
            color:#ddd;
            font-size:17px;
            letter-spacing:1px;
        }
        .botones{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:30px;
        }
        .boton{

            display:inline-block;
            padding:14px 28px;
            border-radius:30px;
            text-decoration:none;
            font-weight:bold;
            color:white;
            border:1px solid #d8b45a;
            background:
            rgba(216,180,90,.08);
            transition:.3s;
        }

        .boton:hover{

            background:#d8b45a;
            color:#111;
            transform:
            translateY(-3px);
            box-shadow:
            0 0 20px
            rgba(216,180,90,.5);
        }
        @keyframes aparecer{
            from{
                opacity:0;

                transform:
                translateY(-20px);
            }
            to{
                opacity:1;

                transform:
                translateY(0);
            }
        }
        @keyframes subir{

            from{

                opacity:0;

                transform:
                translateY(30px);
            }
            to{
                opacity:1;

                transform:
                translateY(0);
            }
        }
        @media(max-width:900px){
            #menu{

                gap:15px;

                padding:0 20px;
            }
            #menu a{

                font-size:14px;
            }
            .encabezado h1{

                font-size:42px;
            }
            .informacion{

                grid-template-columns:1fr;
            }
            .mapa-contenedor{

                height:400px;
            }
        }
        @media(max-width:600px){
            #menu{

                display:none;
            }
            .encabezado{

                padding-top:70px;
            }
            .encabezado h1{

                font-size:34px;
            }
            .subtitulo{

                font-size:11px;

                letter-spacing:4px;
            }
            .ubicacion{

                width:94%;
            }
            .mapa-contenedor{

                height:350px;
            }
            .marcador{

                left:15px;

                top:15px;
            }
            .botones{

                flex-direction:column;
            }
        }
    </style>
</head>
<body>
    <nav id="menu">
        <a href="index.html">
            Volver al Inicio
        </a>
      
    </nav>
    <header class="encabezado">
        <span class="subtitulo">
        </span>

        <h1>
            UBICACION DEL
            <span>
                CRISTO DE LA CONCORDIA
            </span>
        </h1>
        <p>

            Conoce el lugar donde se encuentra uno
            de los monumentos más representativos
            de la ciudad de Cochabamba.

        </p>
    </header>
    <main class="ubicacion">
        <section class="mapa-contenedor">
            <div class="marcador">
                <h3> Cristo de la Concordia  </h3>
                <p>  Cerro San Pedro · Cochabamba</p>
            </div>
            <iframe
                src="https://www.google.com/maps?q=Cristo%20de%20la%20Concordia%20Cochabamba&output=embed"
                loading="lazy"
                allowfullscreen>

            </iframe>
        </section>
        <section class="informacion">
        </section>
        <section class="coordenadas">
            <h2> COORDENADAS DEL LUGAR </h2>
            <p> Cochabamba - Bolivia</p>
        </section>
        <div class="botones">
            <a
                class="boton"
                href="https://www.google.com/maps/search/?api=1&query=Cristo+de+la+Concordia+Cochabamba"
                target="_blank">
                 ABRIR EN GOOGLE MAPS
            </a>
        </div>
    </main>
    <script>
        const tarjetas =  document.querySelectorAll(".tarjeta");

        const observador =
            new IntersectionObserver(
                function(elementos){
                    elementos.forEach(
                        function(elemento){

                            if(
                                elemento.isIntersecting
                            ){
                                elemento.target.style.opacity = "1";
                                elemento.target.style.transform = "translateY(0)";

                            }
                        }
                    );
                },
                {
                    threshold:0.15
                }
            );
        tarjetas.forEach(
            function(tarjeta){

                tarjeta.style.opacity = "0";
                tarjeta.style.transform = "translateY(30px)";
                tarjeta.style.transition = "opacity .7s ease, transform .7s ease";

                observador.observe(tarjeta);
            }
        );

        /* MENÚ AL HACER SCROLL*/ 
        window.addEventListener( "scroll", function(){

                const menu = document.getElementById("menu");


                if(window.scrollY > 50){

                    menu.style.background =   "rgba(3,8,15,.96)";
                }else{

                    menu.style.background = "rgba(5,10,18,.88)";
                }
            }
        );
    </script>
</body>

</html>
